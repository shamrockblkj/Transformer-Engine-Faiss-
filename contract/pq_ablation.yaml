    - 合成的低秩跨块数据上，两边公平选 ε 之后，完整白化的样本外误差比块白化低 37%～43%。它实际是低秩白化，r 取高于 ε 的特征值个数，不另外调。块白化固定默认 ε。「标准差之和」是保守判据，显著性看标准误或配对差值。这组 numpy 数字不和 C++ 的 0.0216 / 0.0230 放一张表。落到 Llama 3 8B 之前，先定低秩实现和全尺寸的校准样本数。
