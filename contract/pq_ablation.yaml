# PQ 消融契约。只约束 128×64 自检和此后的复测口径。
# 0.4642 是样本内、n=32、单种子自制 k-means 的结果，不是 Faiss 全尺寸，不能判定 S3。
# 评估集就是校准集。独立评估集的数字出来后再替换。

status: 复测尚未执行。0.4642 已标成样本内、n=32。

primary_metric:
  name: 输出 MSE
  space: 反白化并乘回行尺度之后的原始空间
  query: 激活保持原样，不做白化
  priority: 优先指标

cost_metric:
  name: 小行相对误差
  definition: 按行 L2 范数取最小的 n/4 行，平均 ||w-ŵ||/||w||
  rule: 不能单独否决白化
  ceiling:
    rule: 小行相对误差的升幅超过 X% 时，必须单独评审。这条不能省。
    X_percent: null
    X_status: 等真实激活的多种子结果出来再定
    seen:
      axis_aligned_vs_raw: 坐标独立的合成数据上，相对原样 +3.2%（0.1979 → 0.2043）
      positive_control_vs_diag: 阳性对照里，相对对角白化 +62%（0.2019 → 0.3267）。同时输出 MSE 从 1.0450 降到 0.5175，约一半。代价比坐标独立那次大一个量级。

tradeoff:
  note: 白化改善整体输出，代价是小范数行变差
  why:
    identity: 在块对角近似下，白化空间的 Frobenius 误差等于输出误差的块内部分；跨块协方差项不受控制。
    full_matrix_only: "‖ΔW'‖_F^2 = E‖ΔW·x‖^2 要 Σ 是完整矩阵。现在是 16 个 4×4 的块对角 Σ，这个等式不成立。"
    decomposition: "E‖ΔW·x‖^2 = Σ_b tr(ΔW_b Σ_bb ΔW_bᵀ) + 跨块交叉项。白化空间里的 k-means 只压前一项。"
    scale: 输出 MSE 按行数和样本数取平均，和上面的量相差 1/n_rows，只是成正比。
    implication: 1.2783 降到 0.4642 符合这个机制，但不能说它证明了完整矩阵上的恒等式。
    cost: 质心集中到激活能量大的方向。小行在弱方向上的分量分不到质心，所以小行相对误差上升。
    priority: 输出 MSE 优先。小行相对误差只作为代价报告，不能单独否决白化。
  single_seed_128x64:
    design: 样本内、n=32。估计 Σ 和计算输出 MSE 用的是同一 32 条激活。
    raw:        {small_row_relative: 0.1979, output_mse: 1.2783}
    row_rms:    {small_row_relative: 0.1933, output_mse: 1.2672}
    whiten:     {small_row_relative: 0.2043, output_mse: 0.4642}
    both:       {small_row_relative: 0.2260, output_mse: 0.4602}
    diag_whiten: {small_row_relative: 0.2043, output_mse: 0.4630}
    error_split:
      raw:    {within_mse: 1.3002, within_share: 1.017, cross_mse: -0.0219, cross_share: -0.017}
      whiten: {within_mse: 0.4743, within_share: 1.022, cross_mse: -0.0101, cross_share: -0.022}
      diag_whiten: {within_mse: 0.4737, within_share: 1.023, cross_mse: -0.0108, cross_share: -0.023}
    diag_reading: 0.4630 和 0.4642 几乎相同，小行相对误差都是 0.2043，交叉项都约 -2.2%。坐标独立时每个 4×4 的 Σ 基本是对角阵，非对角只是 32 条样本的估计噪声，所以 Σ^{1/2} 和逐通道 √E[x²] 几乎相同。这只说明两条路径算法一致，说明不了块内结构有没有用。
    cross_reading: 交叉项只是辅助指标，可能为负，不能当损失。它小只说明各块残差没有叠加，不能说明块对角近似没有损失。块白化按 Σ_bb 分配质心，全局最优要用条件度量 Σ_bb − Σ_bc Σ_cc⁻¹ Σ_cb。这部分损失不在交叉项里。

whitening:
  layout: 权重按行存放。量化前对每个 4 维子向量做 W' = W Σ^{1/2}
  inverse: 质心反白化是 W' Σ^{-1/2}，再乘回行尺度
  roundtrip_without_quantization:
    required_abs: 1.0e-12
    measured_abs: 8.349e-14
    passed: true
  forward_check:
    statement: "||Σ^{1/2} v||^2 与 v^T Σ v 一致，前向不是 Σ^{-1/2}"
    max_relative: 5.442e-15
    passed: true
  python_roundtrip_v2:
    script: scripts/whiten_roundtrip_check_v2.py
    calls: pq_layer 的 prepare_work 与 restore_work，不是检查脚本自己的参考实现
    data: 与 128×64 自检同一块 W 和同一 32 条 X
    pass_bar: weight_rel < 1.0e-10 且 eye_err < 1.0e-7
    whiten_only:
      weight_rel: 1.011e-15
      out_rel: 8.192e-16
      passed: true
    row_rms_and_whiten:
      weight_rel: 1.009e-15
      out_rel: 8.411e-16
      passed: true
    cond_max: 6.458e+04
    cond_median: 4.187e+04
    warnings: [样本数 32 < 10×4, 条件数大于 1e3]
    conclusion: 0.4642 就是原始空间的输出误差。prepare_work 和 restore_work 的往返都通过了。
  python_roundtrip_v1:
    script: scripts/whiten_roundtrip_check.py
    data: 与 128×64 自检同一块 W 和同一 32 条 X
    order: 行 RMS，再 W' = W Σ^{1/2}，不量化，乘 Σ^{-1/2}，乘回行尺度
    pass_bar: weight_rel_ok < 1.0e-10
    weight_rel_ok: 1.049e-15
    weight_rel_wrong: 3.053e+01
    out_mse_ok: 5.204e-27
    out_mse_wrong: 9.843e+07
    passed: true
    raw_sigma_max_block_cond: 6.564e+04
    note: 不量化时行尺度会消掉，行 RMS 开或关的往返数字相同。最差 4×4 块条件数约 6.6e4，ε 和估计质量仍会在量化后放大弱方向误差。

sigma:
  shape: 每个子空间一个 4×4 块
  full_matrix: false
  subspaces_in_128x64: 16
  centering: 不减均值，使用 E[xx^T]
  eigen_floor: 1.0e-8
  eigen_floor_meaning: 开方前把小于该值的特征值抬到该值。抬高后往返仍用同一对尺度。
  this_run:
    activation_rows: 32
    eigenvalues: 64
    min_raw_eigenvalue: 9.417e-4
    clamped: 0
    epsilon_moved_the_0_4642: false
  leakage: 估计 Σ 的 32 条激活就是计算输出 MSE 的那 32 条。结果偏乐观。

condition_numbers:
  accepted_next_issue: 往返已经通过。接下来记条件数，不改 0.4642 的口径。
  source: 坐标独立的合成自检，不是 Llama 3 8B 的激活。不能拿来当作模型激活的病态程度。
  systematic: 这批合成数据的 16 块全部病态，不是个别块。原始 λmax/λmin 最大 6.564e4，中位 4.231e4，最小 2.165e4。另一批各向同性随机激活的中位数大约只有 63，那也是合成的。
  centering_diagnostic:
    changes_the_metric: false
    reason: 对输出误差，不减均值的二阶矩是正确的量。减均值协方差只用来对照条件数。
    this_matrix:
      uncentered_median: 4.231e4
      centered_median: 4.162e4
      centered_max: 6.626e4
      centered_min: 2.191e4
      finding: 减均值没有把条件数降下来。能量在某一个坐标的方差里，是生成方式造成的：该坐标乘了 8，其余乘了 0.05。这不是 Llama 3 8B 的特征。真实激活仍要留减均值诊断，因为公共均值或离群方向可能只出现在那里。
  relative_eps:
    definition: ε = 1.0e-6 * tr(Σ) / 4
    upper_bound: ε ≤ 1e-6·λmax。条件数 6.564e4 时，ε/λmin 的上界约 6.5%。
    measured_max: 1.641e-2
    measured_median: 1.058e-2
    tied_to_condition: 仍是这批合成自检。ε/λmin ≈ 1e-6 × 条件数 / 4。最大条件数 6.564e4 约为 1.64%，中位 4.231e4 约为 1.06%，与实测一致。ε/λmin 由条件数决定，不必再单独找原因。
    truncated_blocks: 0
    reading: 没有触发截断。比例由条件数决定，每块仍记 ε/λmin，不记成是或否。
  absolute_floor:
    value: 1.0e-8
    role: 产生 0.4642 的代码用这个绝对下限。它和相对 ε 分开记。
    truncated_blocks: 0

retest:
  status: 尚未执行
  paths:
    - 原样
    - 行 RMS
    - 子空间白化
    - 两者都用
    - 对角白化
    - full_whiten
    - OPQMatrix
    - PCAMatrix(eigen_power=-0.5)
  path_count: 8
  diag_whiten: 只用 Σ 的对角元做逐通道缩放，不做 4×4 旋转。接近块白化就说明旋转没起作用；明显更差就说明块内协方差有贡献。
  full_whiten: 用完整 Σ^{1/2} 变换权重，再对变换后的向量做子空间 PQ。和块白化的输出 MSE 之差才是块对角近似的损失。交叉项只是辅助指标，可能为负，不能当损失。校准集必须独立，而且样本数不少于 max(256, 维度)。n=32 的 64×64 Σ 秩最多 32，求逆主要由 ε 决定，128×64 自检不拿那次的 MSE 当这条的结果。完整白化对块白化，目前只有退化数据上的结果，还没有结论。
  kmeans_seeds_per_path: 5
  report: 每条路径报均值和标准差
  sigma_source: 独立校准集，几百到几千条，估计后固定
  mse_source: 另一批激活
  record_per_block:
    - lambda_max
    - lambda_min
    - condition
    - eps
    - eps_over_lambda_min
    - truncated
    - condition_centered
  record_counts: [calibration_tokens, eval_tokens]
  condition_centered_role: 只诊断，不改白化，不改输出 MSE 的口径
  error_split: 每条路径另记块内部分和跨块交叉项占实际输出误差的比例。交叉项可以为负。
  shared_sigma: 需要 Σ 的路径共用同一份校准估计
  this_128x64_counts: {calibration_tokens: 32, eval_tokens: 32, eval_is_subset_of_calibration: true, label: 样本内、n=32}
  positive_control:
    purpose: 独立评估集出来之前，先确认脚本能分出块白化和对角白化。若这种数据上两者仍接近，问题在脚本或 pq_layer，不在数据。
    data: 合成。每个 4 维块先给潜变量标准差 8、0.05、0.05、0.05，再左乘该块自己的随机正交阵。块与块之间仍然独立。样本内，n=32。同一套权重。
    whiten: {small_row_relative: 0.3267, output_mse: 0.5175, within_share: 0.967, cross_share: 0.033}
    diag_whiten: {small_row_relative: 0.2019, output_mse: 1.0450, within_share: 0.995, cross_share: 0.005}
    cost: 小行相对误差从对角白化的 0.2019 升到块白化的 0.3267，约 +62%。输出 MSE 约降一半。
    reading: 子空间白化的输出 MSE 是对角白化的大约一半，脚本能分出块内结构。交叉项 3.3% 和 0.5% 只说明没有跨块结构时交叉项很小；这点差别多半是 32 条样本的噪声被更大的 ΔW 放大，不是跨块协方差。块白化是否接近对角白化，要等真实激活。
  reverse_control:
    purpose: 只留一个大潜变量，看交叉项会不会变大。它变大了，但三步检查里的残差相关仍然在独立底上。不能用这个占比决定 d_sub。
    data: 合成。64 维里只留一个标准差为 8 的潜变量，其余为 0.05，再左乘一个全局正交阵。十六个同样大的潜变量混开后，量化残差的交叉项会抵消；各向同性噪声再旋转，Σ 仍接近单位阵。样本内，n=32。同一套权重。
    sigma_off_block_energy: 0.904
    unquantized_cross_share: -30.761
    whiten: {small_row_relative: 0.2031, output_mse: 0.0191, within_share: 1.353, cross_share: -0.353}
    reading: 一个大潜变量时，种子 7 的交叉项占 -35.3%。同一批 X 上另四个 k-means 种子是 -11.1%、-43.4%、-14.7%、-5.6%，负号 5/5。符号稳定，幅度不稳定。各块误差沿大方向系统性反相关，总误差小于块内部分，块对角近似在这个特例里占了便宜。交叉项的绝对值不能直接当损失。
  three_step:
    script: scripts/cross_block_diag.py
    definition: ① ||Σ 的非对角块|| / ||Σ||，要和坐标独立那组的 0.578 比，不能和 0 比；② 块白化后 Σ 的非对角块最大绝对值；③旧是残差各列相关矩阵的非对角块绝对值平均，只在 Σ 接近各向同性时有意义。③改成把各块残差投到 Σ 的最大特征向量 u 上，a_{i,b}=u_bᵀδ_{i,b}。Pearson 是这些投影按块标准化后的平均相关。二次型是 Σ_i[(Σ_b a_{i,b})²−Σ_b a_{i,b}²] / Σ_i(Σ_b a_{i,b})²，对应 Σ≈λuuᵀ 时的交叉项。
    null_resid: 128 行独立残差的 |相关系数| 期望大约是 0.07。
    axis: {off_energy: 0.578, max_canon: 0.603, resid_cross: 0.072, top_pearson: -0.028, top_quad: -0.305, top_energy: 0.169, cross_share: -0.022}
    many: {off_energy: 0.880, max_canon: 0.848, resid_cross: 0.070, top_pearson: -0.014, top_quad: -0.289, top_energy: 0.160, output_mse: 1.2613, cross_share: -0.016}
    one: {off_energy: 0.951, max_canon: 0.887, resid_cross: 0.066, top_pearson: -0.015, top_quad: -0.358, top_energy: 0.997, output_mse: 0.0191, cross_share: -0.353}
    reading: ① 的 0.880 和 0.951 高于坐标独立的 0.578，旋转作用在 X 上。③旧三组都在 0.07 附近，单一方向被其余坐标冲淡。改成投到主方向以后，Pearson 仍只有 -0.015 左右，因为按块标准化会抹掉幅度。二次型在 one 上是 -35.8%，和交叉项 -35.3% 对齐，这个方向占迹的 99.7%。axis 和 many 的主方向二次型也大约 -30%，但那个方向只占迹的 16% 左右，所以总交叉项仍然接近零。交叉项不适合当主诊断。
  full_vs_block:
    data: 合成，一个大潜变量再乘全局正交阵。正交阵来自种子 31。校准 256 条，种子 101。评估 256 条，种子 202。两批独立。k-means 种子 7 到 11，8 次迭代，8 个质心。
    check: 前向用 ||Σ^{1/2} v||² 对 vᵀΣv，相对差必须小于 1e-6，否则程序退出。不量化的往返也必须小于 1e-6。这次两项都过了。
    block_mse: [0.0228, 0.0244, 0.0206, 0.0204, 0.0195]
    full_mse: [0.0269, 0.0235, 0.0204, 0.0224, 0.0218]
    mean: {block: 0.0216, full: 0.0230}
    spectrum: {top1_share: 0.998, tail_share: 0.002, conditional_ratio: 0.002}
    std: 五个种子的样本标准差，除以 4。
    in_sample: {block: 0.0217, block_std: 0.0020, full: 0.0197, full_std: 0.0022}
    eval: {block: 0.0216, block_std: 0.0020, full: 0.0230, full_std: 0.0025}
    eps_scan:
      note: 只改完整白化的 ε。块白化仍是上面的 0.0216 ± 0.0020。ε 是加在特征值上的相对下限，1e-6·tr/64 为默认。
      "1e-4": {eval: 0.0220, eval_std: 0.0022, in_sample: 0.0191, in_std: 0.0020}
      "1e-3": {eval: 0.0180, eval_std: 0.0025, in_sample: 0.0170, in_std: 0.0025}
      "1e-2": {eval: 0.0127, eval_std: 0.0024, in_sample: 0.0129, in_std: 0.0025}
      "1e-1": {eval: 0.0110, eval_std: 0.0027, in_sample: 0.0112, in_std: 0.0027}
    keep_scan:
      note: 小于第 k 大的特征值抬到第 k 个，反白化的增益被封顶。k=1 时下限等于最大特征值，度量接近各向同性缩放。
      1: {eval: 0.0770, eval_std: 0.0071, in_sample: 0.0774, in_std: 0.0071}
      4: {eval: 0.0150, eval_std: 0.0026, in_sample: 0.0152, in_std: 0.0027}
      8: {eval: 0.0154, eval_std: 0.0026, in_sample: 0.0156, in_std: 0.0026}
      16: {eval: 0.0165, eval_std: 0.0026, in_sample: 0.0165, in_std: 0.0026}
    longer: {seed: 7, iterations: 25, block_eval: 0.0212, full_eval: 0.0261, block_in: 0.0213, full_in: 0.0231}
    amplification:
      split: 按校准集最大特征向量把输出 MSE 拆成主方向、其余 63 维、以及两项的交叉。五项都是 5 个种子的平均。
      block_in: {strong: 0.0214, weak: 0.0003, cross: -0.0000}
      block_out: {strong: 0.0213, weak: 0.0003, cross: -0.0000}
      full_in: {strong: 0.0092, weak: 0.0106, cross: -0.0000}
      full_out: {strong: 0.0091, weak: 0.0143, cross: -0.0004}
      full_out_minus_in: {strong: -0.0000, weak: 0.0038, cross: -0.0004}
      weak_moment: {calib: 0.1559, eval: 0.1580, ratio: 1.014}
      weak_residual: {block: 0.1180, full: 5.8010}
      reading: 样本外完整白化比样本内多出来的部分在弱方向上，主方向几乎不动。块白化的弱方向样本内样本外都是 0.0003。评估集在这 63 维上的总能量只比校准集高 1.4%，但完整白化的残差在这些方向上的均方是块白化的约 49 倍，所以子空间内部对不齐就会进评估 MSE。主方向上完整白化样本内样本外都是 0.009，块白化是 0.021。净差距被弱方向翻过来，不是主方向上的度量更差。
    reading: 秩 1 时 Σ≈λuuᵀ，输出误差只取决于标量 s_i=W_i·u。完整白化和块白化都是对这一个标量做 8 级量化，16 块装的是同一个自由度，PQ 不能跨块联合编码。条件度量平均 0.002，接近零，信息是冗余的，问题不在度量上。样本内完整白化 0.0197，不高于块白化 0.0217。样本外 0.0230 对 0.0216 的差距来自弱方向，见 amplification。这一组不能用来判断完整度量有没有价值。
  graded_latent:
    data: 4、6、8 个全局潜变量，尺度从 8 逐级减半，其余坐标 0.05，再乘一个全局正交阵。校准 256 条，种子 111。评估 256 条，种子 222。正交阵种子 41 加潜变量个数。
    conditional_ratio: 0.001
    top_share: 0.998
    eval_mse:
      4: {block: 0.0540, block_std: 0.0049, full: 0.0656, full_std: 0.0011}
      6: {block: 0.0629, block_std: 0.0066, full: 0.0766, full_std: 0.0024}
      8: {block: 0.0570, block_std: 0.0051, full: 0.0652, full_std: 0.0015}
    weak_out_minus_in: {4: 0.0100, 6: 0.0117, 8: 0.0100}
    weak_residual: {4: {block: 0.1039, full: 13.7358}, 6: {block: 0.0999, full: 14.5422}, 8: {block: 0.0973, full: 12.5292}}
    reading: 条件度量仍是 0.001，前几个特征值占迹的 99.8%。其余块把这几个全局方向张成了，跨块信息还是冗余的，没有离开退化情形。完整白化样本外比样本内多出来的同样在前几个特征向量之外，块白化的弱方向不动。这里的输出 MSE 不能决定完整度量有没有价值，也不能说明 4 维分块够用。
  pq_retest:
