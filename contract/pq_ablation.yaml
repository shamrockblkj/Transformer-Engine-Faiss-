      full: {mse_cal: 0.0213, mse_cal_std: 0.0014, mse_eval: 0.0243, mse_eval_std: 0.0014, weak_share: 0.5023}
      n_weak: 63
    raw: {mse_eval: 0.0680, mse_eval_std: 0.0052}
    eps_select: 前 192 条估计 Σ，后 64 条各自选 ε。用 192 条估计 64×64 比 256 条更噪，选出的 ε 偏大，用回全部 256 条再评估是偏保守的。评估集不进入挑选。
    rank1_selected:
      block: {eps: 1e-3, at_edge: false, held: 0.0209, held_std: 0.0018, oos: 0.0211, oos_std: 0.0016}
      full: {eps: 1e-1, at_edge: false, held: 0.0120, held_std: 0.0017, oos: 0.0120, oos_std: 0.0018}
      held_curve_full: {1e-6: 0.0274, 3e-2: 0.0124, 1e-1: 0.0120, 0.3: 0.0127, 3: 0.0201}
      lead: 0.0091
      std_sum: 0.0034
      rho_full: {median: 1.074, max: 4.226, weighted: 1.355, seed_std: 0.019}
    eps_1e-1_spectrum: {eps_over_lam_max: 0.0016, weak_trace_share: 0.0025, eps_over_weak_mean: 38.7, cond_floored: 635.3, n_above_eps: 1}
    graded:
