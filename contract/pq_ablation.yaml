      4: {block_eps: 1e-1, full_eps: 0.3, block_oos: 0.0645, block_oos_std: 0.0062, full_oos: 0.0407, full_oos_std: 0.0024, lead: 0.0238, std_sum: 0.0086, n_above_eps: 4, rho_weighted: 1.344, rho_max: 3.520, rho_median: 1.088}
      6: {block_eps: 1e-2, full_eps: 0.3, block_oos: 0.0581, block_oos_std: 0.0038, full_oos: 0.0334, full_oos_std: 0.0019, lead: 0.0247, std_sum: 0.0057, n_above_eps: 4, rho_weighted: 1.346, rho_max: 3.519, rho_median: 1.142}
      8: {block_eps: 1e-4, full_eps: 1e-1, block_oos: 0.0637, block_oos_std: 0.0118, full_oos: 0.0393, full_oos_std: 0.0051, lead: 0.0243, std_sum: 0.0169, n_above_eps: 5, rho_weighted: 1.314, rho_max: 3.568, rho_median: 1.126}
    reading: 网格含 3e-2，四组的 at_edge 都是假，曲线到 3 都已回升，块白化没有一路降到 3。秩 1 上块白化选中 1e-3，64 条上和 1e-6 只差 0.0001；完整白化选中 1e-1，评估集 0.0120±0.0018 对块白化 0.0211±0.0016，领先 0.0091，大于两边标准差之和 0.0034。rho 在选中的 ε 上、用五个种子的评估贡献平均后再加权。秩 1 组是中位 1.074、最大 4.226、加权 1.355，各种子加权的标准差 0.019。4、6、8 个潜变量分别是加权 1.344、1.346、1.314。放大集中在估得偏低的方向上，选中的 ε 把这些方向抬平以后，放大被压下去。
    conclusion:
      scope: 合成的低秩跨块数据。numpy 种子。不和 C++ 的 0.0216 / 0.0230 放进同一张表。
      statement: 两边公平选了 ε 之后，完整白化的样本外误差比块白化低 37%～43%。四组都这样。
      ratio:
        rank1: {full_over_block: 0.57, lead_over_std_sum: 2.7}
        4: {full_over_block: 0.63, lead_over_std_sum: 2.8}
        6: {full_over_block: 0.57, lead_over_std_sum: 4.3}
        8: {full_over_block: 0.62, lead_over_std_sum: 1.4, block_std: 0.0118}
      eight_20seeds:
        block_eps: 3e-2
        block_oos: 0.0607
        block_oos_std: 0.0082
        full_eps: 1e-1
        full_oos: 0.0351
        full_oos_std: 0.0059
        full_over_block: 0.58
        n_above_eps: 5
        note: 种子标准差仍是单个种子的波动，和上面四组的「标准差之和」是同一口径，不能拿倍数去和 1.4 倍比。
        mean_se: {block: 0.0018, full: 0.0013, combined: 0.0022, lead: 0.0256, lead_over_combined: 11.4}
        paired: {mean: 0.0256, std: 0.0065, se: 0.0015, lead_over_se: 17, full_wins: 20, n: 20}
        check: √(0.0018²+0.0013²)≈0.0022，领先约是它的 11.4 倍。配对差值的标准误约 0.0065/√20≈0.0015，领先约是它的 17 倍，20 次全赢。配对把大部分噪声抵消了，所以比合并标准误更强。
      block_eps: 块白化对 ε 不敏感。四组选中的 ε 从 1e-4 到 1e-1，跨了三个数量级。秩 1 上 1e-6 和 1e-3 的差别比标准差小一个量级。20 个种子的 8 潜变量组里，64 条曲线从 1e-6 到 1e-1 都在 0.0593～0.0595，选中的却是 3e-2。这一段基本是平的，选到哪一点取决于验证样本的噪声。固定用默认 1e-6，不逐层选。
      full_eps: 完整白化选中的 ε 落在 0.1～0.3，20 个种子的 8 潜变量组仍是 1e-1。曲线有谷底，必须选。
      form: 选中的 ε 下只留下 1 个、或 4～5 个高于 ε 的特征值，其余方向抬成各向同性。实际是白化前 r 个主方向，其余方向不白化。r 取高于 ε 的特征值个数，不另外调，也不往上加。ε 按 tr/d 定义，换一个谱，同一个 ε 留下的 r 就不同。
      rho: 加权值高于中位数，放大集中在估得偏低的方向上。选中的 ε 把这些方向抬平以后，放大被压下去。下面都是五个种子、各自选中的 ε。秩 1 组：加权 1.355，中位 1.074，最大 4.226，各种子标准差 0.019。4 个潜变量：加权 1.344，中位 1.088，最大 3.520。6 个潜变量：加权 1.346，中位 1.142，最大 3.519。8 个潜变量：加权 1.314，中位 1.126，最大 3.568。四组加权都在 1.31～1.35，弱方向放大在四组里都成立，不是秩 1 的特例。
      rank_scan:
        data: 8 个潜变量，20 个种子，ε 固定 1e-1。r 不超过高于 ε 的个数时，和这一档 ε 相同。r 更大时，多出来的方向改回用自己的特征值。
        spectrum: 高于 ε 的是 5 个。第 6、7、8 个特征值分别是 ε 的 0.50、0.13、0.046 倍。
        5: {oos: 0.0351, oos_std: 0.0059}
        8: {oos: 0.0356, oos_std: 0.0059, paired_vs_5: -0.0005, paired_std: 0.0005, better_than_5: 2}
        16: {oos: 0.0373, oos_std: 0.0057, paired_vs_5: -0.0023, paired_std: 0.0006, better_than_5: 0}
        reading: r=8 不比 r=5 好，20 个种子里只有 2 次更好。r=16 二十次全输，样本外变差，不是变平。多出来的方向特征值本来就在 ε 附近，单独白化就是把收缩撤掉一部分，弱方向的放大又回来了。所以 r 取高于 ε 的特征值个数，不另外调，也不往上加。比它小，主方向白化不全，自测里 r=1、2 明显更差，这次没有重跑这一侧。比它大，会把弱方向的放大带回来。
      before_llama:
        status: 合成数据能回答的都答完了。剩下两件只能用 Llama 3 8B 的真实激活：重尾谱和离群通道，以及全尺寸校准样本取 d 的几倍。
        inference: x·Ŵᵀ = x·Σ^{-1/2}·Wq′ᵀ，所以 Σ^{-1/2} 乘在解码后的权重上，和乘在激活上，是同一个变换。区别只在什么时候算。离线解码只付一次代价。在线解码或者用 PQ 码查表时，每个 token 都要付一次，这时用低秩形式，代价 O(d·r)，不用稠密矩阵。块白化对应的代价是 d·4。d=4096 的稠密形式是每个 token 一次 4096×4096。契约指定低秩实现，并写明是离线解码还是在线变换。
        spectrum: 这四组是人为造的少数几个大潜变量。真实激活的谱是重尾的，还有离群通道，有效秩和所需的 ε 都可能不同。d=4096 时完整 Σ 的校准样本按 n ≥ 数倍 d 来定，具体倍数等真实谱出来再定。
        first_measurement: 见文末 llama_retest。校准和评估各 16d 条 token，按序列切分。先看谱、ε 和 r，再跑块白化、低秩完整白化和 raw。
  settled:
    - 交叉项只是辅助指标，可能为负，不能当损失。
    - 秩 1 对照中，块对角近似靠残差抵消占了便宜，5 个 k-means 种子的交叉项都是负的。
    - 合成的低秩跨块数据上，两边公平选 ε 之后，完整白化的样本外误差比块白化低 37%～43%。这一阶段收尾。r 取高于 ε 的特征值个数，不另外调，也不往上加。块白化固定默认 ε。弱方向放大在四组里都成立。「标准差之和」是保守判据，显著性看标准误或配对差值。这组 numpy 数字不和 C++ 的 0.0216 / 0.0230 放一张表。重尾谱、离群通道和全尺寸样本倍数见 llama_retest，还没有实测。

llama_retest:
  script: scripts/llama3_retest.py
  status: 脚本已入库。numpy 自测跑通。collect 需要 torch、transformers 和权重，这里没跑。第一次只跑一层，层号就是 model.layers 的下标。
  first_run: python3 scripts/llama3_retest.py collect --model /路径/Meta-Llama-3-8B --cal cal.jsonl --eval eval.jsonl --layers 1 --positions attn_in o_in mlp_in --out runs/ && python3 scripts/llama3_retest.py analyze --stats runs/ --d-sub 4 --k 256 --seeds 2 --select-seeds 1
  numpy_selftest:
    data: d=64，5 个大方向加重尾，一个离群通道，首 token 放大 20 倍。k=8，numpy k-means，不加载模型。
    lowrank: 两种首 token 口径都赢了块白化。含首 token 的配对 z 是 12.5 和 21.7，排除后是 6.8 和 16.0。5 个种子全赢。r 都是 5。r=2 明显更差，r=10 和 r=20 的 z 不超过 3，不往上加。
    rho: 含首 token 中位 7.952、最大 18.580、加权 1.474。排除后中位 1.064、最大 1.380、加权 1.033。
    pass: lowrank_pass 在两种口径上都是真。ε 不在网格端点。这是合成自测，不能当成 Llama 的结果。
  inherits: 流程和指标沿用合成阶段。ε 只在校准集内部选，网格仍是 1e-6、1e-4、1e-3、1e-2、3e-2、0.1、0.3、1、3。选完后在该档全部校准序列上重估 Σ，再打评估集。评估集不进入挑选。交叉项只是辅助，可能为负，不能当损失。减均值只用于条件数对照，不改白化。r 取高于 ε 的特征值个数，不另外调，也不往上加。块白化的 ε 固定 1e-6。
  open_questions: [重尾谱和离群通道, 全尺寸校准样本取 d 的几倍]
  corpus:
    scene: 方案 Gate 0 的部署场景是通用文本上的 WikiText-2 与 C4 困惑度。目标任务还没有业务方指定，所以不用领域语料。
    calibration: C4 训练集里互不重叠的文档。
    evaluation: WikiText-2 训练集里互不重叠的文档。
    held_out: 不使用 WikiText-2 的 test，也不使用日后要报 C4 困惑度的那一份验证划分。激活评估和日后的困惑度不共用序列。
    split: 切分以序列为单位。一条序列里的 token 高度相关，不能在 token 级别随机切分。
  pq:
    d_sub: 4
    nbits: 8
    k: 256
    scope: 这是方案里 FFN 的部署配置，打在 gate、up、down。注意力和词表走 FP8，不在这套 PQ 里。第一轮仍量化三个 4096 维位置，q、k、v、o 的误差要标明不是部署路径。
    iterations: 用 Faiss 的 train / compute_codes 及其默认迭代。不用合成脚本里的 8 次，那是为了不动 0.4642。
    training_points: 不改 k。Faiss 每个质心至少 39 个训练点，k=256 时至少 9984 行。k_proj 和 v_proj 只有 1024 行，脚本会警告，这两张的量化结果只作参考。q_proj 和 o_proj 是 4096 行，同样低于 9984，也注明。gate 和 up 单层 14336 行，够。down 单层 4096 行不够；部署时每 4 层拼成 16384 行，那是后面的事。
  layers:
    round1: [1, 15]
    index: 脚本把这个数直接用作 model.layers 的下标。1 是第二层，15 是第十六层。靠前的层看离群通道，15 代表中间。第一次只传 --layers 1。
    later: 第一轮三个 4096 维位置都跑通之后，再加最后一层，然后按需要扩到 32 层。
  positions:
    round1:
      - {name: attention 输入, after: input_layernorm, d: 4096, weights: [q_proj, k_proj, v_proj]}
      - {name: o_proj 输入, d: 4096, weights: [o_proj]}
      - {name: MLP 输入, after: post_attention_layernorm, d: 4096, weights: [gate_proj, up_proj]}
    round2:
      - {name: down_proj 输入, after: SwiGLU, d: 14336, weights: [down_proj], reason: d 是 4096 的 3.5 倍，n 要按同样的倍数放大。SwiGLU 之后的谱通常最重尾。}
    sigma: 共用同一个输入的投影共用一个 Σ。输出 MSE 按权重矩阵分开报，gate 和 up 不能并成一个数。
  sample:
    tokens_per_side: 16d
    d4096: 65536
    sequences: 64
    length: 1024
    reserve: 多采若干条备用。坏序列丢掉之后仍凑满 64 条完整序列，不用半截序列去补。
    eps_split: 校准序列按约 3:1 切开，前一份估 Σ，后一份选 ε，再在该档全部校准序列上重估。
    bos: 每段序列都补一个 BOS，并单独记下首 token。分析时减掉就是排除口径，不用重新采样。两个口径都报。部署时首 token 也要过同一层，用哪个口径等真实激活出来再定。自测里含首 token 的 rho 中位 7.95、最大 18.6，排除后降到 1.06 和 1.38。尖峰落在弱方向上，而且校准集和评估集对不齐。真实模型若也是这样，就要定口径，或者把首 token 单独处理。
  spike:
    where: 情况 A 或 B 看残差流，不看投影输入。mlp_in 的投影在 post_attention_layernorm 之后，RMSNorm 把每个 token 的 RMS 拉到 1 附近，token_rms/median 会恒等于 1，永远判成情况 A，而且测不出来。resid 取 decoder layer 的输入，再除以序列中位数。peak 才取投影输入上的 max|x_j|/rms(x)，这是模长被压平之后真正进 Σ 的量。第 15 层的 resid 是上一层的输出，尖峰是前面各层积出来的。
    hook: layer 的 pre-hook 用 with_kwargs=True，需要 PyTorch 2.0 及以上。HF 新版用关键字参数传 hidden_states。torch 的 hook 还没在真实模型上跑过。测量主机上按日志搜索时，以那台机器上脚本的实际文字为准。仓库里这句是「残差流 RMS 和投影 peak 必须同时存在。缺 resid 时不能改用 peak 打分。」另一份脚本写的是「残差流 hook 没有在投影 hook 之前触发：不能用 RMSNorm 之后的 peak 代替打分」，并用 len(resid) 和 len(peak) 是否相等一起检查。正常前向时，decoder layer 的 pre-hook 一定先于它内部投影层的 pre-hook，所以这条断言不一定是两个 hook 的顺序反了。更常见的是两种。layer hook 根本没有触发，或者没拿到 hidden_states，比如 transformers 版本不同、参数传法变了。后一种通常先报 KeyError，走不到这条断言。另一种是 resid 和 peak 的 token 数不同，一般是 batch 维或序列维取错了。真的报错时，把完整 traceback 以及 transformers、torch 的版本一起发回。不管是哪一种，都不能改用 peak 打分。
    output: 每条序列按 resid 留 top-5，字段是序列号、位置、token id、resid、peak，写在 *_stats.npz 的 cal_spikes 和 eval_spikes。某个位置的 Σ 满了就不再记这个位置的尖峰，也不再把同一篇文档的后半段送进模型。spike_report.json 报超过 --spike-thr（默认 10）的尖峰数、其中 pos 0 的占比、pos>0 的 token 排行和涉及的序列数，以及这些超阈值尖峰里 pos 0 和其余位置的 peak 中位数。没有超阈值尖峰时不判情况。有尖峰且 pos 0 占比 ≥95% 是情况 A，否则是情况 B。缺 resid 时不能改用 peak 打分。
    selftest: 200 条序列，首 token 放大 50 倍，每 4 条在位置 20 放一个放大 30 倍的换行。判成情况 B，pos 0 占 80%，该 token 出现 50 次、中位位置 20。
    case_b: 尖峰出现在 pos>0 也不一定要把它们放进 Σ。只出现在固定前缀里，例如 system prompt 的换行，前缀缓存可以预计算 KV，和 BOS 一样。出现在用户输入里且位置不固定，预计算用不上，只能纳入 Σ，或者用旋转把尖峰吸收掉。排行里的 median_pos 和 token 文本用来区分这两种。
    dtype: 激活按 bf16 采集，Σ 用 float64 累加。
  spectrum_first:
    before_pq: 每个位置先出下面几项，不跑 PQ。
    eigenvalues: log 尺度的谱。前 1、8、64 个方向的能量占比，以及参与率 (Σλ)²/Σλ²。
    outliers: E[x_j²] 的 max/median，以及超过中位数 100 倍的通道数。
    block_condition: 1024 个 4×4 块的条件数，报最小值、中位数、最大值，并和减均值后的条件数对照。减均值不改白化。
    eps_r: 校准集内部选出的 ε 和有效秩 r，必须报是否落在网格端点。
    rho: 中位数、最大值、加权值。加权仍是各种子的评估贡献先平均再加权。配对不够、种子加到 20 个时，用这 20 个重新平均，不留在最初的 5 个。共用一个 Σ 的各张权重按各自的残差能量相加，不是等权。
    question: ε 在 0.1～0.3 时，r 是个位数还是几百。若是几百，O(d·r) 的推理代价和「少数几个大潜变量」都要重新评估，这一轮不能把低秩完整白化写进部署。
  n_sweep:
    multiples: [1, 2, 4, 8, 16]
    design: 评估集固定为那 64 条序列。校准用同一批序列的前缀。d=4096、序列长 1024 时，1、2、4、8、16 倍分别是前 4、8、16、32、64 条。每一档都重做选 ε、重估 Σ、再评估。
    rule: 块白化和低秩完整白化分开取最小倍数。低秩还要求 r 与 16d 相同。样本外 MSE 相对 16d 的增幅不超过 1%，或者配对差值不超过 2 个标准误，两条满足一条即可。只和 16d 比 1 个标准误会顶在最大档，因为标准误很小，等于要求完全一样。返回值等于最大档时记成未收敛，不记成需要 16d。最大档和自己比一定通过，扫不到更小的档只说明范围内没收敛。扫描只有一档时不判收敛，label 写成「N (仅一档，不判收敛)」，converged 为空。`--mult 1` 的校准快照只有 0.75d 和 1d，扫描只剩 1d，它自己就是最大档，这一行不能读成没收敛。每一档的失败原因和 converged 一起输出，只有两种。低秩的 r 和最大档不同，记 r_mismatch(r=该档→最大档)，这一档直接跳过。r 相同但 MSE 超出容差，记 mse_tol，这才是 Σ 估计的方差。r 随倍数不下降，多出来的方向是样本增多后才估出来的，最大档本身也未必够。相邻两档 r 相同也归这一类，不要求严格上升。来回跳要求 r 至少下降过一次，是 ε 附近的特征值不稳定，问题在 ε 的选择，不在样本数。两类不重叠。归类用所有档的 r，包括通过的档、mse_tol 的档和最大档本身，不能只看标了 r_mismatch 的失败档。mse_tol 那一档的 r 已经和最大档对齐，不会写进 r_mismatch 标签。漏掉它，中间是否下降过就可能判错。报告另给 r 序列。只有一档时序列只有一个数，例如摸底的 `1:r`，记成「仅一档，不归类」，和倍数那一行的「仅一档，不判收敛」一样。判断不了有没有下降过，不归这两类。mse_tol 和这两种 r_mismatch 都能支持排除首 token 来估 Σ，写进契约时的理由不一样。
    selftest: numpy 自测，d=64、k=8。含首 token 时块白化和低秩都是 >=16（未收敛），不读成需要 16d。失败档：块白化 1、2、4、8 都是 mse_tol；低秩是 r_mismatch(r=2→5)、r_mismatch(r=2→5)、r_mismatch(r=4→5)，8 是 mse_tol。完整 r 序列是 2、2、4、5、5，对应 1d、2d、4d、8d、16d。8d 是 mse_tol，r 已经是 5，和最大档相同，不写在 r_mismatch 里。只看失败档会漏掉最后这个 5。算上它才是完整序列，不下降，归第一类。1d 和 2d 都是 r=2，不是严格上升。排除首 token 后，块白化是 2，低秩是 1，这两档收敛，块白化的 1 倍是 mse_tol。自测里首 token 是人为放大 20 倍、能量 400 倍构造出来的，所以这次未收敛只说明判读逻辑是对的，不是 Llama 的结果。扫描只有一档时，倍数 label 是「1 (仅一档，不判收敛)」，converged 为空；r 序列记成「仅一档，不归类」。这两条在自测开头单独断言，不靠这次 16 档扫描。
    readout: 测量主机跑完 collect 和 analyze 后，发回 spike_report.json 和 analyze 的输出。先看三样。尖峰判的是情况 A 还是 B。排除首 token 后，有效秩 r 是多少。低秩对块白化的配对 z。`--mult 1` 摸底时，倍数那一行是「仅一档，不判收敛」，r 序列是「仅一档，不归类」，这两行都不拿来下结论。需要分档判断的，只用 1、2、4、8、16 这五档的完整 r 序列，等这五档的扫描出来再判。
  paths:
    - {name: raw, eps: null}
    - {name: 块白化, eps: 1e-6}
    - {name: 低秩完整白化, eps: 校准集内部选, r: 高于 ε 的特征值个数}
    - {name: 对角白化, eps: 1e-6, role: 辅助}
  rank_scan: 在选中的 ε 上，比较 r 等于高于 ε 的个数，以及这个数的 2 倍和 4 倍，且不超过 d。更大的 r 不更好，就不往上加。r > r_eff 且 z 落在 [1, 6) 时，这张权重的种子加到 seeds_ext 再扫一遍。区间用带符号的 z：只加「更大的 r 看起来更好」的一侧。默认自测里这些行的 z 是负的，不会加种子。
  decision:
    seeds: 每条路径先跑 5 个 k-means 种子。配对差值不足 3 个配对标准误时，加到 20 个种子再判。种子数少于 5 时也加到 seeds_ext。加完仍少于 5，lowrank_pass 不定，两个子判定为空，不算通过也不算不通过。20 个种子之后仍不足 3 个，这个矩阵不采纳低秩完整白化。配对判定和 r 扫描用同一批种子。block 和 lowrank 一起补，小行相对误差和 rho 的贡献同步补。
    primary: 原始空间的样本外输出 MSE。
    also_report: [小行相对误差, 交叉项占比]
    cross_role: 没有小行口径时，交叉项占比只作辅助，不能当损失。
    adopt: 两层、三个 4096 维位置上，每一张权重对块白化的配对差值都超过 3 个标准误，并且 r 扫描确认不需要往上加，低秩完整白化才写进契约。
    fallback: 有一张权重不满足，就这张退回块白化，按层、按矩阵分别记录。不因为旁边的矩阵过了就把整层写成低秩。
  cost_note: d=4096 时，6.6 万条激活累加 Σ 约 1.1e12 次运算。4096×4096 的特征分解在 CPU 上要几十秒。14336 维的 float64 Σ 约 1.6 GB，特征分解要几分钟。这些都在 48GB 的 4090 主机上做。
