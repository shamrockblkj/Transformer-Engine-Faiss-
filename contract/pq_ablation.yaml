    weak_residual: {4: {block: 0.1039, full: 13.7358}, 6: {block: 0.0999, full: 14.5422}, 8: {block: 0.0973, full: 12.5292}}
    reading: 条件度量仍是 0.001，前几个特征值占迹的 99.8%。其余块把这几个全局方向张成了，跨块信息还是冗余的，没有离开退化情形。完整白化样本外比样本内多出来的同样在前几个特征向量之外，块白化的弱方向不动。这里的输出 MSE 不能决定完整度量有没有价值，也不能说明 4 维分块够用。
  pq_retest:
    script: scripts/pq_retest.py
    separate_from_cpp: 这里全是 numpy 种子。C++ 自检的 0.0216 / 0.0230 是另一套实现，两组数字不能放进同一张表。
    rule: 样本内完整白化不差、样本外明显更差、放宽 ε 后差距收窄或反超，判成样本外放大。两条路径各自选 ε 之后，领先幅度要大于两边种子标准差之和。这个「标准差之和」是保守判据：种子数变多时，单个种子的标准差不缩小，倍数不会因此变强。显著性看均值的标准误，或同一组 k-means 种子上的配对差值。at_edge 为真或曲线到 3 还在降，先不下结论。
    grid: [1e-6, 1e-4, 1e-3, 1e-2, 3e-2, 1e-1, 0.3, 1, 3]
    data: 权重种子 11。秩 1 的正交阵 31，校准 101，评估 202。8 次迭代，5 个种子，标准差除以 4。
